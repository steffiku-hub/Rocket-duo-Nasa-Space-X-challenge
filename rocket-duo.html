<title>Rocket Workshop · Two-Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;700&display=swap">
<style>
/* Layout: 1920x1080 split — left 5fr game console (keyboard only), right 3fr paper manual (mouse only). Deliberate single look: dark console vs. paper book. */
:root{
  --bg:#0b0f14; --panel:#121922; --line:#233040; --fg:#dfe7ef; --dim:#7f90a3;
  --accent:#ff7a1a; --ok:#3ddc97; --warn:#ffcc33; --bad:#ff4d5e; --blue:#4da3ff;
  --paper:#efe8d8; --ink:#2a2620; --ink-dim:#6d6455; --rule:#cbbfa6; --tab:#b5462b;
  --display:"Chakra Petch",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden}
.split{display:grid;grid-template-columns:5fr 3fr;height:100%}
/* ---------- left console ---------- */
.console{display:flex;flex-direction:column;min-width:0;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;gap:12px;pointer-events:none;user-select:none}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.06em}
.brand span{color:var(--accent)}
.steps{display:flex;gap:6px}
.steps b{font-family:var(--display);font-size:12px;letter-spacing:.1em;padding:4px 10px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.steps b.on{border-color:var(--accent);color:var(--fg)}
.steps b.done{color:var(--ok)}
.meta{margin-left:auto;display:flex;gap:14px;align-items:center;font-family:var(--display);font-size:13px;color:var(--dim)}
.bar{width:120px;height:10px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.stage{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;position:relative;overflow:hidden}
.keys{font-family:var(--display);font-size:13px;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap}
kbd{font-family:var(--display);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 6px;color:var(--fg);background:#0e141b}
h2{font-family:var(--display);font-size:13px;letter-spacing:.14em;color:var(--dim);margin:0 0 12px;text-transform:uppercase}
.focus{outline:3px solid var(--accent);outline-offset:2px}
/* mission cards */
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mcard{border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.mcard .code{font-family:var(--display);font-size:34px;color:var(--accent)}
.mcard p{margin:0;color:var(--dim);line-height:1.6}
/* assembly */
.asm{display:grid;grid-template-columns:260px 1fr;gap:20px;height:100%}
.asm canvas{width:100%;height:100%;background:#070a0e;border-radius:4px}
.rows{display:flex;flex-direction:column;gap:10px;overflow:auto}
.srow{display:grid;grid-template-columns:90px repeat(4,1fr);gap:10px;align-items:center;border:1px dashed var(--line);border-radius:4px;padding:10px}
.srow .lbl{font-family:var(--display);color:var(--dim)}
.cell{border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;align-items:center;gap:8px;min-height:46px;font-family:var(--display);font-size:16px}
.cell small{color:var(--dim);font-size:11px;display:block}
.cell.edit{background:#2a1a0c;border-color:var(--accent)}
.chip{width:22px;height:30px;border-radius:3px;flex:none}
.act{font-family:var(--display);border:1px solid var(--line);border-radius:4px;padding:10px 14px;letter-spacing:.08em}
.lights{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.light{display:flex;align-items:center;gap:8px;font-family:var(--display);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.light i{width:14px;height:14px;border-radius:50%;background:#333}
.light.g i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.light.r i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
/* weather */
.wgrid{display:grid;grid-template-columns:70px repeat(7,1fr);gap:6px}
.wgrid .hd{font-family:var(--display);color:var(--dim);font-size:13px;text-align:center;padding:4px}
.wcell{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-family:var(--display);font-size:17px;line-height:1.6;position:relative;min-height:150px}
.wcell .ic{font-size:30px;line-height:1.2}
.wcell.past{opacity:.25}
.wcell.scrub::after{content:"SCRUB";position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-size:18px;background:rgba(11,15,20,.6)}
/* flight */
.flight{display:grid;grid-template-columns:1fr 330px;gap:14px;height:100%}
.flight canvas{width:100%;height:100%;border-radius:4px;background:#000;min-height:0}
.ground{display:flex;flex-direction:column;gap:10px;min-height:0}
.gauges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gauge{border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-family:var(--display)}
.gauge small{color:var(--dim);font-size:12px}
.gauge b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.gauge .gu{font-size:12px;color:var(--dim);margin-left:6px;font-weight:500}
.gauge.hot{border-color:var(--warn);background:#2a2208}
.alert{border:2px solid var(--line);border-radius:6px;padding:12px;font-family:var(--display);min-height:170px;display:flex;flex-direction:column;gap:6px}
.alert .code{font-size:46px;line-height:1}
.alert.on{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{border-color:transparent}}
@media (prefers-reduced-motion:reduce){.alert.on{animation:none}}
.alert .timer{font-size:20px}
.alert .input{color:var(--dim)}
.result{display:flex;flex-direction:column;gap:14px;max-width:900px;max-height:100%;overflow:auto}
.result h3{font-family:var(--display);font-size:40px;margin:0}
.result ol{margin:0;padding-left:20px;line-height:1.9}
/* ---------- right manual ---------- */
.manual{background:#2b2620;padding:14px;padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;min-width:0;border-left:4px solid #000}
.mnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mnav button{font:600 14px var(--body);border:1px solid #5a5040;background:#3a3329;color:#f3ead6;border-radius:4px;padding:8px 12px;cursor:pointer}
.mnav button:hover{background:#4a4235}
.mnav button:focus-visible{outline:2px solid var(--accent)}
.mnav .emg{background:var(--tab);border-color:var(--tab);color:#fff;margin-left:auto}
.mnav .pg{color:#cfc4ae;font-family:var(--display);font-size:13px}
.book{flex:1;min-height:0;overflow:auto;background:var(--paper);color:var(--ink);border-radius:3px;padding:28px 34px;font-family:var(--serif);font-size:16px;line-height:1.7;box-shadow:inset 0 0 40px rgba(120,90,40,.18)}
.book h1{font-size:26px;margin:0 0 4px}
.book .sec{font-family:var(--display);font-size:12px;letter-spacing:.16em;color:var(--tab)}
.book h3{font-size:18px;margin:18px 0 6px}
.book table{border-collapse:collapse;width:100%;font-family:var(--body);font-size:14px;margin:8px 0}
.book th,.book td{color:var(--ink);border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left;vertical-align:top}
.book th{color:var(--ink-dim)!important;font-weight:500}
.book td.n{font-variant-numeric:tabular-nums;font-family:var(--display)}
.book .src{font-family:var(--body);font-size:12px;color:var(--ink-dim)}
.book .step{border:2px solid var(--ink);border-radius:4px;padding:10px 14px;margin:10px 0;font-family:var(--body)}
.book .step b.k{font-family:var(--display);font-size:22px;color:var(--tab)}
.book a{color:var(--tab);cursor:pointer;text-decoration:underline}
.book .ok{color:#1d7a4a;font-weight:700}.book .no{color:#a8321f;font-weight:700}
.mnav .mtitle{font-family:var(--display);font-weight:700;letter-spacing:.2em;color:#f3ead6;font-size:16px;margin-right:4px}
/* ---------- weather side info / budget ---------- */
.wwrap{display:grid;grid-template-columns:1fr 250px;gap:14px}
.ledger{border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--display);font-size:14px;display:flex;flex-direction:column;gap:6px}
.ledger .row{display:flex;justify-content:space-between;gap:8px}
.ledger .row span:first-child{color:var(--dim)}
.ledger .big{font-size:26px}
.ledger hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.dl{display:inline-block;border:1px solid var(--bad);color:var(--bad);border-radius:3px;padding:2px 8px;font-family:var(--display);margin-left:8px}
.wcell.late{background:repeating-linear-gradient(135deg,rgba(255,77,94,.08) 0 8px,transparent 8px 16px)}
.wwrap{grid-template-columns:1fr 225px}
.wwrap .wcell{font-size:14px;padding:6px 7px;min-height:120px;white-space:nowrap;line-height:1.7}
.wgrid .hd.late{color:var(--bad)}
/* ---------- launch ready ---------- */
.ready{display:grid;grid-template-columns:1fr 340px;gap:20px;height:100%}
.ready .warnbox{border:2px solid var(--warn);border-radius:6px;padding:16px 20px;background:#1d1806;line-height:1.7}
.ready .warnbox b{color:var(--warn)}
.poll{display:flex;flex-direction:column;gap:6px;font-family:var(--display)}
.poll div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 2px}
.poll .go{color:var(--ok)}
.count{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;gap:12px;padding:20px}
.count .num{font-family:var(--display);font-size:120px;line-height:1;font-variant-numeric:tabular-nums;color:var(--warn)}
.count .num.go{color:var(--ok);font-size:64px}
.startbtn{font-family:var(--display);font-size:22px;letter-spacing:.12em;border:2px solid var(--line);color:var(--dim);border-radius:6px;padding:14px 22px;text-align:center}
.startbtn.on{border-color:var(--ok);color:#06140d;background:var(--ok);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 24px var(--ok)}}
@media (prefers-reduced-motion:reduce){.startbtn.on{animation:none}}
.alert .wrong{color:var(--bad);font-family:var(--body);font-size:14px;line-height:1.45;background:rgba(255,77,94,.08);border-radius:4px;padding:6px 8px}
.emgcall{position:relative;border:4px solid var(--bad);border-radius:8px;background:#2a0b10;padding:18px 90px 18px 22px;animation:emgblink 1s steps(2) infinite}
.emgcall .big{display:block;font-family:var(--display);font-weight:700;font-size:34px;line-height:1.15;color:#fff;letter-spacing:.03em}
.emgcall .sub{display:block;margin-top:8px;color:#ffb3bb;font-size:16px}
.emgcall .arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:56px;color:var(--bad);animation:nudge 1s ease-in-out infinite}
@keyframes emgblink{50%{border-color:#ffd0d5;box-shadow:0 0 28px rgba(255,77,94,.6)}}
@keyframes nudge{50%{transform:translate(10px,-50%)}}
.mnav .emg.call{animation:emgbtn 1s ease-in-out infinite;outline:3px solid #fff;outline-offset:2px}
@keyframes emgbtn{50%{box-shadow:0 0 0 8px rgba(255,77,94,.45);transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.emgcall,.emgcall .arrow,.mnav .emg.call{animation:none}}
/* ---------- orbit success ---------- */
.orbitwrap{position:relative;height:100%}
.orbitwrap canvas{width:100%;height:100%;display:block;border-radius:4px;background:#02040a}
.orbitcard{position:absolute;left:24px;top:24px;max-width:430px;background:rgba(10,16,24,.82);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;padding:18px 22px;display:flex;flex-direction:column;gap:8px}
.orbitcard h3{font-family:var(--display);font-size:30px;margin:0;color:var(--ok);line-height:1}
.orbitcard .row{display:flex;justify-content:space-between;font-family:var(--display);font-size:16px;gap:20px}
.orbitcard .row span:first-child{color:var(--dim)}
.orbitback{position:absolute;right:24px;bottom:24px;font-family:var(--display);font-size:18px;background:rgba(10,16,24,.82);border:1px solid var(--line);border-radius:6px;padding:10px 16px}
.orbitback b{color:var(--accent);font-size:26px;font-variant-numeric:tabular-nums}

/* ---------- tutorial overlay ---------- */
.tut{position:fixed;inset:0;background:rgba(4,7,11,.86);display:grid;place-items:center;z-index:50;padding:24px}
.tutbox{width:min(1080px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;overflow:hidden}
.tuthead{display:flex;justify-content:space-between;padding:14px 26px 0;font-family:var(--display);font-size:13px;letter-spacing:.16em;color:var(--accent)}
.tutpg{color:var(--dim)}
.tutbody{padding:10px 26px 18px;overflow:auto;line-height:1.65;font-size:16px}
.tutbody h1{font-family:var(--display);font-size:34px;margin:4px 0 10px;letter-spacing:.02em}
.tutbody h3{font-family:var(--display);font-size:17px;margin:14px 0 4px;color:var(--fg)}
.tutbody p{margin:6px 0;color:#c6d1dc}
.tutbody ul{margin:6px 0;padding-left:22px;color:#c6d1dc}
.tutbody li{margin:3px 0}
.tutbody b{color:var(--fg)}
.real{border-left:3px solid var(--blue);background:#0d1724;padding:8px 14px;margin:10px 0;border-radius:0 4px 4px 0;font-size:15px}
.real::before{content:"REAL WORLD";display:block;font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--blue)}
.caution{border-left:3px solid var(--warn);background:#1d1806;padding:8px 14px;margin:10px 0;border-radius:0 4px 4px 0;font-size:15px}
.caution::before{content:"WATCH OUT";display:block;font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--warn)}
.roles{display:grid;grid-template-columns:5fr 3fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0}
.roles>div{padding:14px 16px}
.roles .l{background:#0e141b}
.roles .r{background:var(--paper);color:var(--ink)}
.roles .r p,.roles .r li{color:var(--ink)}.roles .r b{color:var(--ink)}
.roles .tag{font-family:var(--display);font-size:12px;letter-spacing:.16em}
.roles .l .tag{color:var(--accent)}.roles .r .tag{color:var(--tab)}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.flow div{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:13px;line-height:1.45;color:var(--dim)}
.flow div b{display:block;font-family:var(--display);font-size:14px;color:var(--fg)}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.tgrid>div{border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:14.5px}
.tgrid .c{font-family:var(--display);font-size:24px;color:var(--accent)}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--dim);font-weight:500;font-family:var(--display);font-size:12px;letter-spacing:.1em}
.tutnav{display:flex;align-items:center;gap:10px;padding:12px 26px;border-top:1px solid var(--line);background:#0e141b}
.tutnav button{font:600 15px var(--body);border:1px solid var(--line);background:#16202b;color:var(--fg);border-radius:4px;padding:9px 16px;cursor:pointer}
.tutnav button:hover{background:#1e2a37}
.tutnav button.pri{background:var(--accent);border-color:var(--accent);color:#1a0d02}
.tutnav button:disabled{opacity:.35;cursor:default}
.tutnav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tutdots{flex:1;display:flex;gap:6px;justify-content:center}
.tutdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tutdots i.on{background:var(--accent)}
.swatch{display:inline-block;width:14px;height:20px;border-radius:2px;vertical-align:middle;margin-right:6px}
</style>

<div class="split">
<section class="console" aria-label="Engineer console (keyboard)">
  <div class="topbar">
    <div class="brand">ROCKET <span>WORKSHOP</span></div>
    <div class="steps" id="steps"></div>
    <div class="meta"><span id="metaM"></span><span>BUDGET</span><div class="bar"><i id="budgetBar"></i></div><span id="metaR"></span></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="keys" id="keys"></div>
</section>

<section class="manual" aria-label="Mission control manual (mouse)">
  <div class="mnav">
    <span class="mtitle">MANUAL</span>
    <button id="mTut">? Tutorial</button>
    <button id="mToc">Contents</button>
    <button id="mPrev">◀</button>
    <button id="mNext">▶</button>
    <span class="pg" id="mPg"></span>
    <button class="emg" id="mEmg">⚠ EMERGENCY</button>
  </div>
  <article class="book" id="book"></article>
</section>
</div>

<div class="tut" id="intro" hidden role="dialog" aria-modal="true" aria-label="Step briefing">
  <div class="tutbox" style="width:min(980px,100%)">
    <div class="tuthead"><span class="tutkicker" id="introKick"></span><span class="tutpg">BRIEFING</span></div>
    <div class="tutbody" id="introBody"></div>
    <div class="tutnav"><span style="flex:1;color:var(--dim);font-size:14px">Engineer: press <kbd>Enter</kbd> · Manual reader: click</span><button id="introOk" class="pri">Got it ▶</button></div>
  </div>
</div>

<div class="tut" id="tut" role="dialog" aria-modal="true" aria-label="Tutorial">
  <div class="tutbox">
    <div class="tuthead"><span class="tutkicker">ROCKET WORKSHOP · BRIEFING</span><span id="tutPg" class="tutpg"></span></div>
    <div class="tutbody" id="tutBody"></div>
    <div class="tutnav">
      <button id="tutSkip">Skip tutorial</button>
      <span class="tutdots" id="tutDots"></span>
      <button id="tutPrev">◀ Back</button>
      <button id="tutNext" class="pri">Next ▶</button>
    </div>
  </div>
</div>

<script>
/* ================= shared data (game + manual) ================= */
const G0=9.80665, MU=3.986e14, RE=6371e3;
const ENG={
  A:{name:"Sparrow",color:"#d8443a",F:900e3, sl:270,vac:300,m:1.6,cost:8, desc:"red, short"},
  B:{name:"Whale",color:"#3b7fd9",F:2400e3,sl:285,vac:315,m:4.2,cost:22,desc:"blue, long"},
  C:{name:"Hydrolox",color:"#e8e8e8",F:1500e3,sl:340,vac:440,m:3.2,cost:36,desc:"white"},
  D:{name:"Vacuum",color:"#d9a52b",F:300e3, sl:120,vac:350,m:0.9,cost:12,desc:"gold, big nozzle"},
};
const TANK={
  T1:{name:"Small",color:"#8fd18f",fuel:10, dry:0.8,cost:2, desc:"green, short"},
  T2:{name:"Medium",color:"#c08fd1",fuel:40, dry:2.6,cost:6, desc:"purple, medium"},
  T3:{name:"Large",color:"#d1c48f",fuel:120,dry:7,  cost:15,desc:"yellow, long"},
};
const MIS=[
  {code:"M-1",name:"Dawn-1",story:"A swarm of tiny satellites built by university students, beaming signals to amateur radio operators around the world.",icon:"📡",payload:2,peri:525e3,budget:80,need:9300,
   req:"4 × 1U CubeSats + dispenser", deadline:7,
   orbit:"Sun-synchronous orbit, 525 km circular",slot:"4 CubeSats released one by one, spreading out into a train",sep:"4 CubeSats deploying",
   real:"SpaceX's Transporter rideshare flights deploy CubeSats into sun-synchronous orbits of about 510–525 km."},
  {code:"M-2",name:"Wingspan",story:"A 3U tech-demo satellite that will unfold a new type of solar panel in space.",icon:"🛰",payload:6,peri:590e3,budget:130,need:9400,
   req:"3U CubeSat + large dispenser", deadline:6,
   orbit:"Sun-synchronous orbit, 590 km circular",slot:"Released on its own, then unfolds its new solar panel",sep:"Wingspan released, panel unfolding",
   real:"Rideshare upper stages often do extra burns to drop a second group of satellites higher, around 590–600 km."},
  {code:"M-3",name:"Supply Line",story:"Carry a supply capsule to the International Space Station's orbit so it can dock with the crew.",icon:"🏠",payload:3,peri:415e3,budget:85,need:9250,
   req:"Supply capsule to ISS altitude", deadline:5,
   orbit:"ISS orbit, 415 km circular",slot:"Inserted on the station's orbit, a short way behind it, ready to close in and dock",sep:"Capsule on the ISS orbit, behind the station",
   real:"The ISS flies at roughly 412–420 km. Real cargo ships are released a bit lower and spend hours to days catching up before docking."},
];
const P=s=>s.split("/").map(x=>{const m=x.match(/(\w)(\d)(T\d)x(\d)/);return{e:m[1],n:+m[2],t:m[3],k:+m[4]};});
const COMBOS={ // per mission quick table; every ✓ row was flight-tested in the simulator to the exact target orbit
  "M-1":["B1T3x1/D1T1x1","B1T3x1/D1T1x2","B1T3x1/D2T1x2","B2T3x1/D1T1x2","A2T1x2/D1T1x1"].map(P),
  "M-2":["B1T3x1/C1T2x1","B2T3x2/D2T1x3","B2T3x1/C1T2x2","B2T3x1/C1T3x1","B2T3x1/D1T2x1"].map(P),
  "M-3":["B1T3x1/D1T1x2","B1T3x1/D2T2x1","B1T3x1/D1T1x1","B1T3x1/C1T1x2","B2T3x1/D2T2x1"].map(P),
};

  "E-04":{t:"Upper stage too weak (thrust-to-weight under 0.9): it can't hold altitude during the circularization burn",fix:"Add 1 engine to the upper stage, use a smaller upper-stage tank, or switch to engine C"},
  "E-05":{t:"Upper stage too small: under 3,700 m/s of Δv on its own, so it can't finish the circularization burn",fix:"Give the top stage a bigger tank or more tanks, or use the efficient D or C engine on it"},

const WARN={
  "W-12":{real:"Around Max-Q, the moment of greatest air pressure on the rocket, real rockets throttle down to protect the structure.",name:"High-altitude wind shear / dynamic pressure",light:"Yellow",lc:"var(--warn)",keys:["A","A"],gauge:"⑦",
    say:"Press A twice", why:"Pitches the nose up 5° to slow through the thick air, bringing dynamic pressure back under 75 kPa",fail:"Dynamic pressure exceeds the limit and the structure breaks up"},
  "W-21":{real:"Many engines cool themselves by running cold propellant around the nozzle. Going over a temperature limit can damage the engine.",name:"Engine overheating",light:"Red",lc:"var(--bad)",keys:["ENTER"],gauge:"⑧",
    say:"Press Enter once", why:"Switches on the backup cooling loop and brings engine temperature back to normal",fail:"Engine damaged: this stage permanently loses 30% thrust"},
  "W-30":{real:"Stages are pushed apart by explosive bolts or springs. If they don't separate, the upper stage has to drag dead weight.",name:"Stage separation sensor fault",light:"Blue",lc:"var(--blue)",keys:["ENTER","ENTER"],gauge:"④",
    say:"Press Enter twice", why:"Manual separation: the first press unlocks, the second fires the separation charges",fail:"The stages stay stuck together, the upper stage drags dead weight, and the mission fails"},
  "W-40":{real:"Small-satellite antennas are often held folded by a thin wire that is burned through with electric current. A failed deployment is a common reason small satellites go silent.",name:"Antenna not deployed",light:"White",lc:"#fff",keys:["D","ENTER"],gauge:"—",

};
const GTITLE=[["Altitude","km"],["Speed","m/s"],["Perigee","km"],["Stage fuel","%"],["Apogee","km"],["Pitch from vertical","°"],["Dynamic pressure","kPa · max 75"],["Engine temp","°C · max 900"]];
const GAUGES=[["①","Altitude","km"],["②","Speed","m/s"],["③","Perigee","km"],["④","Fuel left in current stage","%"],["⑤","Apogee","km"],["⑥","Pitch angle (0 = vertical)","°"],["⑦","Dynamic pressure","kPa, limit 75"],["⑧","Engine temperature","°C, limit 900"]];

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
function rng(seed){let s=seed>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function analyze(stages,m){
  const info=stages.map(s=>{const e=ENG[s.e],t=TANK[s.t];return{F:e.F*s.n,sl:e.sl,vac:e.vac,fuel:t.fuel*s.k*1000,dry:(e.m*s.n+t.dry*s.k)*1000,cost:e.cost*s.n+t.cost*s.k,s};});
  const pay=(m.payload+0.6)*1000;let above=pay;const dvs=[],twr=[];
  for(let i=info.length-1;i>=0;i--){const st=info[i],m0=above+st.fuel+st.dry,m1=above+st.dry;
    dvs[i]=st.vac*G0*Math.log(m0/m1);twr[i]=(i===0?st.F*st.sl/st.vac:st.F)/(m0*G0);above=m0;}
  const hw=info.reduce((a,b)=>a+b.cost,0)+Math.round(m.payload*2);
  const fuelT=info.reduce((a,b)=>a+b.fuel,0)/1000, prop=propCost(fuelT);
  return{info,dvs,twr,total:dvs.reduce((a,b)=>a+b,0),mass:above,cost:hw+prop,hw,prop,fuelT,pay};
}
/* budget rules (game values). Tank design → propellant & scrub cost; launch date → standby; weather → scrub / surcharge */
const STANDBY=4;                                   // per day the pad & crew wait
const propCost=t=>Math.ceil(t/40);                 // propellant + loading, per 40 t
const scrubCost=t=>3+Math.ceil(t/60);              // detank, boil-off, recycle; bigger tanks cost more
const MARGINAL=3;                                  // wind 22–29 kt: extra upper-air balloons & weather team
function spend(label,amt){S.reserve-=amt;S.ledger.push([label,amt]);}
const UPPER_DV=3700; // the top stage alone must be able to finish the job (circularization)
function check(stages,m){const a=analyze(stages,m),e=[];
  if(a.twr[0]<1.15)e.push("E-01");if(a.total<m.need)e.push("E-02");if(a.cost>m.budget)e.push("E-03");
  if(a.twr.slice(1).some(t=>t<0.9))e.push("E-04");
  if(a.info.length>1&&a.dvs[a.dvs.length-1]<UPPER_DV)e.push("E-05");return{a,errors:e};}

/* weather: 7 days x 4 slots, seeded per mission. g1 peak wind kt, g2 temp F, g3 lightning nmi (null none), g4 cumulus nmi (null none) */
const SLOTS=["06:00","12:00","18:00","23:00"];
function makeWeather(seed){const r=rng(seed*97+13),W=[];
  for(let d=0;d<7;d++){const storm=r()<0.35,cold=r()<0.15,windy=r()<0.3,day=[];
    for(let s=0;s<4;s++){const aft=s===1||s===2;
      const wind=Math.round((windy?24:8)+r()*14+(aft?3:0));
      const temp=Math.round((cold?40:68)+r()*12+(aft?10:-4));
      const lightning=storm&&aft&&r()<0.8?Math.round(2+r()*9):null;
      const cu=storm&&r()<0.7?Math.round(3+r()*12):(r()<0.15?Math.round(8+r()*10):null);
      day.push({wind,temp,lightning,cu});}
    W.push(day);}
  // guarantee at least two good slots
  W[2][0]={wind:12,temp:66,lightning:null,cu:null};W[4][3]={wind:16,temp:61,lightning:null,cu:null};
  return W;}
function judge(w){const r=[];
  if(w.wind>29)r.push("wind");if(w.temp<49)r.push("cold");if(w.temp>94)r.push("hot");
  if(w.lightning!==null&&w.lightning<10)r.push("lightning");if(w.cu!==null&&w.cu<10)r.push("cumulus");
  return r;}
function icon(w){if(w.lightning!==null&&w.lightning<12)return"⛈";if(w.cu!==null)return"☁";if(w.wind>25)return"🌬";return"☀";}

/* ================= game state ================= */
const S={phase:0,mi:0,mission:null,stages:[],cur:{r:0,c:0},edit:false,errors:null,

const PHASES=["MISSION","ASSEMBLY","LAUNCH PLAN","LAUNCH PREP","FLIGHT","RESULT"];

function setPhase(p){S.phase=p;render();}
function render(){
  $("steps").innerHTML=PHASES.map((n,i)=>`<b class="${i===S.phase?"on":i<S.phase?"done":""}">${i+1} ${n}</b>`).join("");
  $("metaM").textContent=S.mission?`${S.mission.code} ${S.mission.name}`:"No mission yet";
  $("metaR").textContent=S.mission?`${S.reserve} left`:"";
  if(S.phase!==3)stopReady();
  const pct=S.mission?Math.max(0,Math.min(1,S.reserve/(S.mission.budget*0.4))):1;
  $("budgetBar").style.width=(pct*100)+"%";$("budgetBar").style.background=pct>0.5?"var(--ok)":pct>0.2?"var(--warn)":"var(--bad)";

}

function drawPreview(){const c=$("pv");if(!c)return;const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);
  let y=c.height-30;const tot=S.stages.reduce((a,s)=>a+30+Math.sqrt(TANK[s.t].fuel)*s.k*5,0)+60,sc=Math.min(1.4,(c.height-60)/tot);
  S.stages.forEach((s,i)=>{const w=(40+10*Math.min(s.n,5))*sc*(0.88**i),hh=(30+Math.sqrt(TANK[s.t].fuel)*s.k*5)*sc;
    for(let j=0;j<Math.min(s.n,5);j++){x.fillStyle=ENG[s.e].color;const ew=w/Math.min(s.n,5);x.fillRect(c.width/2-w/2+j*ew+2,y,ew-4,14*sc);}
    x.fillStyle=TANK[s.t].color;x.fillRect(c.width/2-w/2,y-hh,w,hh);
    x.strokeStyle="rgba(0,0,0,.4)";for(let j=1;j<s.k;j++){x.beginPath();x.moveTo(c.width/2-w/2,y-hh*j/s.k);x.lineTo(c.width/2+w/2,y-hh*j/s.k);x.stroke();}
    x.fillStyle="#111";x.font=`700 ${14}px Chakra Petch`;x.textAlign="center";x.fillText(`${i+1}`,c.width/2,y-hh/2+5);
    y-=hh+2;});
  x.fillStyle="#f4f6f8";x.beginPath();x.moveTo(c.width/2-20,y);x.quadraticCurveTo(c.width/2,y-70*sc,c.width/2+20,y);x.fill();}

/* ---------- phase 3 launch ready (10 s prep, then START LAUNCH) ---------- */
const PREP=10;let readyTimer=null;
function stopReady(){if(readyTimer){clearInterval(readyTimer);readyTimer=null;}$("mEmg").classList.remove("call");}
function goReady(w){S.pendingW=w;S.prep={end:performance.now()+PREP*1000};setPhase(3);
  stopReady();$("mEmg").classList.add("call");readyTimer=setInterval(()=>{if(TUT.open||INTRO_ST.open)S.prep.end+=100;if(S.phase===3)renderReady();},100);}

    $("stage").innerHTML=`<div class="ready" id="rdy"><div style="display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto">
      <div><h2 style="margin-bottom:4px">READY FOR LAUNCH</h2>
      <div style="font-family:var(--display);font-size:28px">${S.mission.code} ${S.mission.name} · Day ${S.wcur.d+1}, ${SLOTS[S.wcur.s]}</div></div>
      <div class="poll"><div><span>Vehicle</span><b class="go">GO</b></div><div><span>Weather</span><b class="go">GO</b></div>
        <div><span>Range</span><b class="go">GO</b></div><div><span>Budget remaining</span><b>${S.reserve}</b></div></div>
      <div class="warnbox"><b>⚠ Things WILL go wrong after liftoff.</b><br>

        <b>Left</b> reads the <b>code, light colour and highlighted gauge</b> → <b>Right</b> finds it on the Manual's Emergency Codes page and reads out the keys → <b>Left</b> presses them.<br>
        Pressed a wrong key? Just start again before time runs out.<br>

      <div class="emgcall"><span class="big">MANUAL READER:<br>PRESS ⚠ EMERGENCY NOW</span><span class="arrow">➜</span>
        <span class="sub">Keep the emergency codes open for the whole flight.</span></div>

function kReady(k){if(k==="E"&&performance.now()>=S.prep.end){stopReady();startFlight(S.pendingW);}}

/* ---------- phase 3 flight ---------- */
function startFlight(w){
  const a=analyze(S.stages,S.mission),r=rng(S.mi*31+S.wcur.d*7+S.wcur.s+5);
  const ev=[];
  if(w.wind>=22||r()<0.35)ev.push({code:"W-12",at:{t:28}});
  if(r()<0.55)ev.push({code:"W-21",at:{t:70+r()*30}});
  if(a.info.length>1&&r()<0.6)ev.push({code:"W-30",at:{fuel0:0.06}});
  ev.push({code:"W-40",at:{orbit:true}});
  S.flight={a,t:0,x:0,y:RE,vx:465,vy:0,stage:0,fuel:a.info.map(s=>s.fuel),pitch:0,manual:0,q:0,maxQ:0,path:[],
    mode:"asc",thrustMul:a.info.map(()=>1),events:ev,active:null,log:[],running:true,orbit:false,temp:420,stuck:false,heat:false};
  flog("Ignition! Liftoff");
  S.phase=4;render();last=performance.now();requestAnimationFrame(loop);
}
function flog(m){S.flight.log.push(`T+${S.flight.t.toFixed(0)}s ${m}`);}
function orbitOf(x,y,vx,vy){const r=Math.hypot(x,y),v2=vx*vx+vy*vy,eps=v2/2-MU/r,h=x*vy-y*vx;
  const e=Math.sqrt(Math.max(0,1+2*eps*h*h/MU/MU));if(eps>=0)return{esc:true,rp:(h*h/MU)/(1+e),ra:Infinity};const a=-MU/(2*eps);return{rp:a*(1-e),ra:a*(1+e)};}
const RESP=10; // seconds the team gets to respond to each warning
const PARK=70e3,INS_CUT=2e3,INS_TOL=15,INS_DEPLOY=12,INS_HOLD=24; // cutoff margin (m), tolerance (km), sim-seconds after cutoff for deploy / result
function trigger(code){const f=S.flight;f.active={code,left:RESP,input:[],wrong:0,guard:performance.now()+600};flog(`Ground warning ${code}`);}
function step(dt){
  const f=S.flight,a=f.a,m=S.mission,r=Math.hypot(f.x,f.y),h=r-RE,ux=f.x/r,uy=f.y/r,ex=uy,ey=-ux;
  const rho=h<150e3?1.225*Math.exp(-h/8400):0,p=rho/1.225,turn=90e3;
  let auto=h<800?0:Math.min(1,Math.pow((h-800)/turn,0.55))*Math.PI/2*0.97;
  const vr0=f.vx*ux+f.vy*uy;
  if(f.mode==="asc"&&h>30e3){const o=orbitOf(f.x,f.y,f.vx,f.vy),err=o.esc?1e9:(o.ra-RE-m.peri); // burn 1: put apogee on the target altitude
    const cmd=Math.PI/2+Math.max(-0.42,Math.min(0.5,err/25e3));auto=err>0?cmd:Math.min(auto,cmd);}
  if(f.mode==="coast")auto=Math.PI/2;
  if(f.mode==="circ")auto=Math.PI/2+Math.max(-1,Math.min(0.6,vr0/40+(h-m.peri)/15e3)); // burn 2 at apogee: horizontal, hold the target altitude
  f.manual*=Math.exp(-dt/4);if(f.mode!=="asc")f.manual=0; // autopilot pulls pilot nudges back within a few seconds
  f.pitch=Math.max(0,Math.min(Math.PI/2+0.5,auto+f.manual));
  const st=a.info[f.stage];let F=0;
  if(st&&!f.orbit&&f.mode!=="coast"&&f.fuel[f.stage]>0){
    const thr=f.q>35e3?Math.max(0.55,1-(f.q-35e3)/25e3):1,mul=f.thrustMul[f.stage];
    let trim=1;if(f.mode==="circ"){ // final trim: throttle down as speed approaches circular, like a real upper stage
      let m0=a.pay;for(let i=f.stage;i<a.info.length;i++)m0+=a.info[i].dry+f.fuel[i];
      const vt=Math.abs(f.vx*ex+f.vy*ey),need=Math.sqrt(MU/r)-vt,A=mul*st.F/m0;trim=Math.max(0.01,Math.min(1,need/(A*0.6)));}
    const isp=st.vac-(st.vac-st.sl)*p,mdot=trim*thr*mul*st.F/(st.vac*G0);

    const ph=(now/900)%1;x.strokeStyle=`rgba(61,220,151,${1-ph})`;x.lineWidth=2;x.beginPath();x.arc(sx,sy,12+ph*30,0,7);x.stroke();
    x.fillStyle="#fff";x.font="600 14px Chakra Petch, sans-serif";x.fillText(m.code,sx,sy+(sy<cy?-26:34));
    x.textAlign="right";x.fillStyle="rgba(127,144,163,.8)";x.font="500 13px Chakra Petch, sans-serif";x.fillText("not to scale: altitude exaggerated",W-16,H-80);x.textAlign="left";
    orbitRAF=requestAnimationFrame(frame);}
  stopOrbit();orbitRAF=requestAnimationFrame(frame);orbitTO=setTimeout(()=>{if(S.phase===5)backToMissions();},ORBIT_SHOW*1000);
}
function renderResult(){const R=S.result,ok=R.ok===true,part=R.ok==="partial";
  if(ok&&S.mission&&R.rp)return renderOrbit();
  const title=ok?"MISSION SUCCESS":part?"PARTIAL SUCCESS":"MISSION FAILED",col=ok?"var(--ok)":part?"var(--warn)":"var(--bad)";
  const chain=[...R.reasons];
  if(S.delays)chain.push(`Waiting and scrubs cost ${S.delays} day${S.delays===1?"":"s"} of delay, paid from the budget`);
  $("stage").innerHTML=`<div class="result"><h3 style="color:${col}">${title}</h3>
    <div><h2>What happened</h2><ol>${chain.map(c=>`<li>${c}</li>`).join("")}</ol></div>
    <div><h2>Budget breakdown (budget ${S.mission?S.mission.budget:"—"})</h2><p style="font-family:var(--display);font-size:14px;line-height:1.8">${(S.ledger||[]).map(([l,v])=>`${l}  −${v}`).join("<br>")||"—"}<br><b>Remaining ${S.reserve}</b></p></div>
    <div><h2>Team performance</h2><p>Warnings handled ${R.handled} / ${R.total} · Max dynamic pressure ${(R.maxQ/1000).toFixed(1)} kPa · Flight time ${R.t.toFixed(0)} s · Budget left ${S.reserve}</p></div>
    <div><h2>Flight log</h2><p style="font-family:var(--display);font-size:13px;color:var(--dim);line-height:1.7">${R.log.slice(-12).join("<br>")}</p></div>
    <div class="real" style="font-size:14px">Every real flight gets a post-flight review, and failures are studied so they aren't repeated. What would your team change next time?</div></div>`;
  keysHint([[K("Enter"),"back to mission select"]]);
}

/* ================= keyboard (left player only) ================= */
const MAP={w:"U",arrowup:"U",s:"D",arrowdown:"D",a:"L",arrowleft:"L",d:"R",arrowright:"R",enter:"E"," ":"E"};
addEventListener("keydown",ev=>{if(TUT.open)return tutKey(ev);if(INTRO_ST.open)return introKey(ev);const k=MAP[ev.key.toLowerCase()];if(!k)return;ev.preventDefault();if(ev.repeat&&(k==="E"||(S.phase===4&&S.flight&&S.flight.active)))return;
  if(S.lock)return; // ignore input while a phase transition is pending
  [kMission,kAssembly,kWeather,kReady,kFlight,kResult][S.phase](k,ev.key.toLowerCase());});
function kMission(k){if(k==="L"||k==="U")S.mi=(S.mi+MIS.length-1)%MIS.length;if(k==="R"||k==="D")S.mi=(S.mi+1)%MIS.length;
  if(k==="E"){S.mission=MIS[S.mi];S.stages=[{e:"A",n:1,t:"T1",k:1}];S.cur={r:0,c:0};S.errors=null;S.reserve=S.mission.budget;S.delays=0;S.ledger=[];setPhase(1);return;}renderMission();}
function kAssembly(k){const rows=asmRows(),row=rows[S.cur.r];
  if(S.edit&&row.type==="stage"){const s=S.stages[row.i],f=FIELDS[S.cur.c],d=k==="U"?1:k==="D"?-1:0;
    if(f==="e"){const ks=Object.keys(ENG);s.e=ks[(ks.indexOf(s.e)+d+ks.length)%ks.length];}
    if(f==="t"){const ks=Object.keys(TANK);s.t=ks[(ks.indexOf(s.t)+d+ks.length)%ks.length];}
    if(f==="n")s.n=Math.max(1,Math.min(9,s.n+d));if(f==="k")s.k=Math.max(1,Math.min(6,s.k+d));
    if(k==="E")S.edit=false;if(d)S.errors=null;renderAssembly();return;}
  if(k==="U")S.cur.r=Math.max(0,S.cur.r-1);if(k==="D")S.cur.r=Math.min(rows.length-1,S.cur.r+1);
  if(k==="L")S.cur.c=Math.max(0,S.cur.c-1);if(k==="R")S.cur.c=Math.min(3,S.cur.c+1);
  if(k==="E"){if(row.type==="stage")S.edit=true;
    if(row.type==="add"&&S.stages.length<3){S.stages.push({e:"D",n:1,t:"T1",k:1});S.errors=null;S.cur.r++;}
    if(row.type==="del"&&S.stages.length>1){S.stages.pop();S.errors=null;S.cur.r=Math.max(0,S.cur.r-1);}
    if(row.type==="check"){const c=check(S.stages,S.mission);S.errors=c.errors;
      if(!c.errors.length){S.reserve=S.mission.budget;S.ledger=[];spend("Hardware (engines + tanks + payload integration)",c.a.hw);spend(`Propellant & loading (${Math.round(c.a.fuelT)} t)`,c.a.prop);S.scrubFee=scrubCost(c.a.fuelT);S.weather=makeWeather(S.mi+1);S.day=0;S.scrubs={};S.wcur={d:0,s:0};
        renderAssembly();S.lock=true;setTimeout(()=>{S.lock=false;setPhase(2);},900);return;}}}
  renderAssembly();}
function kWeather(k){const c=S.wcur;if(k==="L")c.d=Math.max(S.day,c.d-1);if(k==="R")c.d=Math.min(6,c.d+1);
  if(k==="U")c.s=Math.max(0,c.s-1);if(k==="D")c.s=Math.min(3,c.s+1);
  if(k==="E"){if(S.scrubs[c.d+"-"+c.s])return;const wait=c.d-S.day;
    if(wait)spend(`Pad standby, ${wait} day${wait===1?"":"s"}`,wait*STANDBY);S.delays=(S.delays||0)+wait;S.day=c.d;
    const fail=r=>{S.result={ok:false,reasons:r,log:[],maxQ:0,t:0,handled:0,total:0};setPhase(5);};
    if(c.d+1>S.mission.deadline)return fail([`Day ${c.d+1} is past the ${S.mission.code} deadline (day ${S.mission.deadline})`,"The customer's satellite missed its window and the contract was cancelled"]);
    if(S.reserve<0)return fail(["Pad standby fees used up the whole budget"]);
    const w=S.weather[c.d][c.s],bad=judge(w);
    if(bad.length){S.scrubs[c.d+"-"+c.s]=1;spend(`SCRUB day ${c.d+1} ${SLOTS[c.s]}`,S.scrubFee);S.delays++;
      if(S.reserve<0)return fail(["Too many scrubs: the budget ran out"]);
      render();return;}
    if(w.wind>=22)spend("Marginal wind: extra weather balloons",MARGINAL);
    if(S.reserve<0)return fail(["Out of budget: can't pay for launch day"]);
    goReady(w);return;}
  renderWeather();}
function kFlight(k){const f=S.flight;if(!f||!f.running)return;
  if(f.active){if(performance.now()<f.active.guard)return; // ignore keys still held from steering
    const act=f.active,key=k==="E"?"ENTER":k==="L"?"A":k==="R"?"D":k==="U"?"W":"S",need=WARN[act.code].keys,pos=act.input.length,nm=x=>x==="ENTER"?"Enter":x;
    if(need[pos]!==key){ // wrong: explain why, clear the input so the next try starts fresh; the timer keeps running
      act.wrong++;
      act.why=!need.includes(key)?`You pressed ${nm(key)}. ${nm(key)} isn't part of the ${act.code} procedure.`
        :pos===0?`You pressed ${nm(key)} first. That key is used in ${act.code}, but not as the first step.`
        :`You pressed ${nm(key)} as key ${pos+1}. That isn't the next step: check the order in the Manual.`;
      act.tried=act.input.concat(key);act.input=[];drawFlight();return;}
    act.input.push(key);if(act.input.length===need.length){resolve(true);f.cool=performance.now()+700;}else drawFlight();return;}
  if(f.cool&&performance.now()<f.cool)return; // swallow accidental extra presses right after a fix
  if(k==="L")f.manual=Math.max(-0.08,f.manual-0.03);if(k==="R")f.manual=Math.min(0.08,f.manual+0.03);}
function kResult(k){if(k==="E")backToMissions();}

/* ================= manual (right player, mouse only) ================= */
function engRows(){return Object.entries(ENG).map(([k,e])=>`<tr><td><span class="swatch" style="background:${e.color}"></span><b>${k}</b> ${e.name}</td><td>${e.desc}</td><td class="n">${e.F/1000}</td><td class="n">${e.sl} / ${e.vac}</td><td class="n">${e.m}</td><td class="n">${e.cost}</td></tr>`).join("");}
function tankRows(){return Object.entries(TANK).map(([k,t])=>`<tr><td><span class="swatch" style="background:${t.color}"></span><b>${k}</b> ${t.name}</td><td>${t.desc}</td><td class="n">${t.fuel}</td><td class="n">${t.dry}</td><td class="n">${t.cost}</td></tr>`).join("");}
function comboPage(m){const rows=COMBOS[m.code].map(c=>{const st=c.map(s=>({e:s.e,n:s.n,t:s.t,k:s.k})),r=check(st,m);
  const desc=c.map((s,i)=>`Stage ${i+1}: ${s.e}×${s.n} + ${s.t}×${s.k}`).join("<br>");
  return `<tr><td>${desc}</td><td class="n">${Math.round(r.a.total)}</td><td class="n">${r.a.twr[0].toFixed(2)}</td><td class="n">${r.a.cost}</td><td>${r.errors.length?`<span class="no">✗ ${r.errors.join(" ")}</span>`:'<span class="ok">✓ passes inspection</span>'}</td></tr>`;}).join("");
  return `<div class="sec">PART 3 · QUICK DESIGNS</div><h1>${m.code} ${m.name}</h1><p>Requirements: Δv ≥ ${m.need} m/s, liftoff thrust-to-weight ≥ 1.15, cost ≤ ${m.budget} (hardware + propellant).<br>The number after "×" is the count. Passing inspection doesn't guarantee orbit: you still have to handle warnings in flight.</p>
   <table><tr><th>Design (bottom to top)</th><th>Δv m/s</th><th>T/W</th><th>Cost</th><th>Inspection</th></tr>${rows}</table>
   <p class="src">Cost here = hardware + propellant. Leave money for pad standby and possible scrubs (see Budget page).</p>`;}
const PAGES=[
 {id:"toc",title:"Contents",html:()=>`<div class="sec">MISSION CONTROL MANUAL</div><h1>Contents</h1>
   <p>You can't see the game screen. Ask the Engineer to describe the codes, colours and numbers they see, then look them up here.</p>
   <table>${PAGES.slice(1).map((p,i)=>`<tr><td class="n">${i+2}</td><td><a data-go="${p.id}">${p.title}</a></td></tr>`).join("")}</table>`},
 {id:"emg",title:"Emergency codes (W codes)",html:()=>`<div class="sec">EMERGENCY</div><h1>Emergency codes</h1><p>Each warning gives you <b>${RESP} seconds</b>, and the flight pauses while you respond. Read the "Press" column straight to the Engineer.</p>
   <table><tr><th>Code</th><th>Light</th><th>Press</th><th>Problem</th></tr>${Object.entries(WARN).map(([c,w])=>`<tr><td class="n"><b>${c}</b></td><td>${w.light}</td><td><b class="k" style="font-family:var(--display);color:var(--tab);font-size:18px">${w.say}</b></td><td>${w.name}</td></tr>`).join("")}</table>
   <p class="src">A wrong key clears the input and the screen says why it was wrong; just press the full sequence again from the first key before time runs out. It only fails when the timer hits zero. Details are on the Part 6 pages.</p>`},
 {id:"mis",title:"Part 1 · Missions",html:()=>`<div class="sec">PART 1</div><h1>Missions</h1><p>Ask the Engineer to read the mission code (M-1, M-2, M-3). <b>Note each mission's deadline</b>: you'll need it when choosing the launch day.</p>
   <table><tr><th>Code</th><th>Payload</th><th>Mass</th><th>Target orbit</th><th>Budget</th><th>Deadline</th></tr>${MIS.map(m=>`<tr><td class="n"><b>${m.code}</b> ${m.name}</td><td>${m.req}</td><td class="n">${m.payload} t</td><td class="n">${m.peri/1000} km ± ${INS_TOL}<br><span class="src">${m.orbit.split(",")[0]}</span></td><td class="n">${m.budget}</td><td class="n">Day ${m.deadline}</td></tr>`).join("")}</table>
   <p>Completing <b>any one</b> mission counts as a successful launch. Success means putting the payload into its <b>target orbit, within ± ${INS_TOL} km</b>, with a working antenna.</p>
   <h3>Where each payload goes</h3><table>${MIS.map(m=>`<tr><td><b>${m.code}</b></td><td>${m.orbit}. ${m.slot}.<br><span class="src">Real world: ${m.real}</span></td></tr>`).join("")}</table>
   <p class="src">Mass includes the dispenser and fairing. CubeSat mass limits: 1U 2.00 kg, 3U 6.00 kg, 6U 12.00 kg (CubeSat Design Specification Rev 14). ISS orbit about 412 × 420 km (NASA, Sept. 2025). Rideshare SSO altitudes from SpaceX Transporter mission reports (NASASpaceflight, eoPortal).</p>`},
 {id:"eng",title:"Part 2 · Parts: engines",html:()=>`<div class="sec">PART 2</div><h1>Engines</h1><p>The Engineer only sees the colour and the letter.</p>
   <table><tr><th>Code</th><th>Looks like</th><th>Thrust kN</th><th>Isp s (sea level / vacuum)</th><th>Mass t</th><th>Price</th></tr>${engRows()}</table>
   <h3>How to choose</h3><p>Stage 1 has to push the whole rocket through thick air, so use high-thrust <b>B</b>. Upper stages work in vacuum, so use efficient <b>C</b> or <b>D</b>. D is very inefficient at sea level: never put it on stage 1.</p>
   <p class="src">Engine numbers are made up for teaching; they are not real rocket data.</p>`},
 {id:"tank",title:"Part 2 · Parts: fuel tanks",html:()=>`<div class="sec">PART 2</div><h1>Fuel tanks</h1>
   <table><tr><th>Code</th><th>Looks like</th><th>Fuel t</th><th>Empty t</th><th>Price</th></tr>${tankRows()}</table>
   <p>"Tanks" is how many tanks are stacked in one stage. More tanks = more Δv, but a heavier rocket at liftoff.</p>
   <p><b>Tank design also affects the budget:</b> more fuel means a higher propellant bill and a more expensive scrub. See the Budget page.</p><p class="src">Made-up teaching values.</p>`},
 ...MIS.map(m=>({id:"combo-"+m.code,title:`Part 3 · Quick designs ${m.code}`,html:()=>comboPage(m)})),
 {id:"err",title:"Part 4 · Fault codes (E codes)",html:()=>`<div class="sec">PART 4</div><h1>Inspection fault codes</h1><p>After INSPECT, a red light means that check failed. Ask the Engineer which codes are red.</p>
   <table><tr><th>Code</th><th>Meaning</th><th>How to fix</th></tr>${Object.entries(ERR).map(([c,e])=>`<tr><td class="n"><b>${c}</b></td><td>${e.t}</td><td>${e.fix}</td></tr>`).join("")}</table>`},
 {id:"wx",title:"Part 5 · Weather",html:()=>`<div class="sec">PART 5</div><h1>Reading the weather grid</h1>
   <p>Each slot shows an icon and four numbers:</p>
   <table><tr><th>Symbol</th><th>Meaning</th><th>Unit</th><th class="ok">GO</th><th class="no">NO-GO</th></tr>
   <tr><td>①</td><td>Peak wind at liftoff</td><td>kt (knots)</td><td>≤ 29</td><td>&gt; 29</td></tr>
   <tr><td>②</td><td>Temperature</td><td>°F</td><td>49–94</td><td>&lt; 49 or &gt; 94</td></tr>
   <tr><td>③</td><td>Nearest lightning</td><td>nmi (— = none)</td><td>— or ≥ 10</td><td>&lt; 10</td></tr>
   <tr><td>④</td><td>Cumulus clouds with freezing tops</td><td>nmi (— = none)</td><td>— or ≥ 10</td><td>&lt; 10</td></tr></table>
   <p>One NO-GO number is enough to <b>scrub</b> the launch.</p>
   <h3>Watch out</h3><p>① between 22 and 29 is still GO, but a <b>W-12 wind shear</b> warning is likely in flight, and it costs an extra ${MARGINAL} for additional weather balloons.</p>
   <p><b>Launching after the mission deadline = mission failed.</b> Each mission has a different deadline (see Missions). For costs, see the Budget page.</p>
   <p>Conversions: 29 kt ≈ 15 m/s; 49°F ≈ 9°C; 94°F ≈ 34.5°C; 10 nmi ≈ 18.5 km.</p>
   <p class="src">Limits based on NASA Artemis II Weather Criteria (wind, temperature) and NASA Falcon 9 Crew Dragon Launch Weather Criteria (lightning, cumulus within 10 nmi). Real rules vary with measurement height and humidity; the game uses one simplified value.</p>`},
 {id:"bud",title:"Part 5 · Budget: date, weather, tanks",html:()=>`<div class="sec">PART 5</div><h1>Budget</h1>
   <p>Money isn't only spent on parts. Launch date, weather and fuel tank design all eat into the budget:</p>
   <table><tr><th>Item</th><th>Affected by</th><th>Cost</th></tr>
   <tr><td>Hardware</td><td>Engines, tanks, payload integration</td><td>See Parts pages</td></tr>
   <tr><td>Propellant &amp; loading</td><td><b>Tank design</b>: more fuel costs more</td><td class="n">1 per 40 t of fuel (rounded up)</td></tr>
   <tr><td>Pad standby</td><td><b>Launch date</b>: the later you launch, the more you pay</td><td class="n">${STANDBY} per day waited</td></tr>
   <tr><td>Scrub</td><td><b>Weather</b> + <b>tank design</b>: fuel has to be drained, and cryogenic fuel boils off</td><td class="n">3 + 1 per 60 t of fuel</td></tr>
   <tr><td>Marginal weather</td><td><b>Weather</b>: ① wind 22–29 kt</td><td class="n">${MARGINAL}</td></tr></table>
   <h3>Deadlines</h3><table><tr><th>Mission</th><th>Deadline</th></tr>${MIS.map(m=>`<tr><td><b>${m.code}</b> ${m.name}</td><td class="n">Day ${m.deadline}</td></tr>`).join("")}</table>
   <p>Tip: first find the GO slots before the deadline, then pick the one with the fewest days of waiting. The bigger your tanks, the more each scrub hurts.</p>
   <p class="src">Real world: propellant is usually a tiny share of launch cost (often under 1%). The expensive parts are the rocket itself, the pad and the team's time. When a launch is scrubbed, cryogenic propellants like liquid oxygen must be drained or left to boil off and the launch rescheduled, which is why every scrub is costly. Rates are game values.</p>`},
 ...Object.entries(WARN).map(([c,w])=>({id:"w-"+c,title:`Part 6 · ${c} ${w.name}`,html:()=>`<div class="sec">PART 6 · FLIGHT PROCEDURES</div><h1>${c} ${w.name}</h1>
   <div class="step">Press: <b class="k">${w.say}</b></div>
   <p><b>Light:</b> ${w.light}  <b>Highlighted gauge:</b> ${w.gauge}</p><p><b>Why:</b> ${w.why}</p><p><b>If not handled:</b> ${w.fail}</p><p><b>Real world:</b> ${w.real}</p>
   ${c==="W-40"?'<p class="src">CubeSat 101 recommends two burn wires for deployable parts. Real CubeSats may not transmit radio signals for the first 45 minutes after deployment (CDS Rev 14).</p>':""}`})),
 {id:"gauge",title:"Part 6 · Gauge key",html:()=>`<div class="sec">PART 6</div><h1>Ground station gauges</h1><p>The Engineer's gauges show a number, a short title and a unit. This page explains them in more detail.</p>
   <table><tr><th>No.</th><th>Meaning</th><th>Unit</th></tr>${GAUGES.map(g=>`<tr><td>${g[0]}</td><td>${g[1]}</td><td>${g[2]}</td></tr>`).join("")}</table>
   <p>Orbit: when ③ perigee and ⑤ apogee both sit on the mission's target altitude, the engine shuts down. That's orbit insertion.</p>`},
 {id:"profile",title:"Part 6 · How the rocket reaches its orbit",html:()=>`<div class="sec">PART 6</div><h1>Flight profile</h1>
   <p>The flight computer flies the rocket to the exact target orbit in three phases. Watch for them in the flight log:</p>
   <table><tr><th>Phase</th><th>What happens</th><th>Gauges</th></tr>
   <tr><td><b>1 · Ascent burn</b></td><td>Stage 1, then the upper stage, burn until the highest point of the orbit (apogee) reaches the target altitude. Then the engine cuts off (SECO-1).</td><td>⑤ apogee climbs to the target</td></tr>
   <tr><td><b>2 · Coast</b></td><td>Engine off. The rocket glides up to apogee. The game speeds time up here.</td><td>① altitude rises, ⑤ stays put</td></tr>
   <tr><td><b>3 · Circularization burn</b></td><td>At apogee the upper stage restarts and burns sideways to raise the low side of the orbit (perigee) up to the target. It throttles down at the end for precision.</td><td>③ perigee climbs to meet ⑤</td></tr>
   <tr><td><b>Orbit insertion</b></td><td>Engine cutoff. If perigee and apogee are both within ± ${INS_TOL} km of the target, the payload separates. A few seconds later, check its antenna (W-40).</td><td>③ ≈ ⑤ ≈ target</td></tr></table>
   <p>If stage 1 is so powerful that it puts apogee on target by itself, it shuts down early and separates with fuel left over (<b>early MECO</b>). Then the upper stage does the rest alone, which is why the upper stage needs enough Δv of its own (E-05).</p>
   <h3>What can go wrong</h3><p>Not enough Δv (E-02) or too small an upper stage (E-05) → the fuel runs out before the circularization burn finishes. An upper stage that's too weak (E-04) can't hold its altitude and falls back.</p>
   <p>Pressing <b>A / D</b> during flight nudges the pitch a little, but the autopilot pulls it back within a few seconds, so extra key presses won't throw the rocket off course.</p>
   <p class="src">Real world: on SpaceX's Transporter-9 rideshare, the second stage first entered a 207 × 537 km transfer orbit, coasted for almost an hour, then made a short burn to circularize before releasing satellites. Real upper stages also throttle down at the end of a burn for accuracy, and Falcon 9 first stages often cut off early (MECO) to save fuel for landing.</p>`},
 {id:"src",title:"Glossary & sources",html:()=>`<div class="sec">APPENDIX</div><h1>Glossary</h1>
   <table><tr><td>Δv</td><td>How much the rocket can change its speed. Reaching orbit takes roughly 9,300 m/s or more (including gravity and drag losses).</td></tr>
   <tr><td>Thrust-to-weight (T/W)</td><td>Thrust ÷ weight. It must be above 1 for the rocket to leave the ground.</td></tr>
   <tr><td>Dynamic pressure / Max-Q</td><td>How hard the air pushes on the rocket. It peaks low in the atmosphere at high speed; that peak is called Max-Q.</td></tr>
   <tr><td>Perigee / apogee</td><td>The lowest and highest points of an orbit above the ground.</td></tr>
   <tr><td>Scrub</td><td>Calling off a launch attempt because of weather or a technical problem.</td></tr>
   <tr><td>Burn wire</td><td>A thin line that is burned through with electric current, letting an antenna or solar panel spring open.</td></tr>
   <tr><td>Transfer orbit</td><td>A stretched orbit whose high point touches the target altitude. The rocket coasts along it to get there cheaply.</td></tr>
   <tr><td>Circularization burn</td><td>A burn at apogee that raises perigee until the orbit is round.</td></tr>
   <tr><td>Orbit insertion / SECO</td><td>The moment the engine shuts down in the planned orbit (SECO = second engine cutoff).</td></tr>
   <tr><td>Go / no-go</td><td>The final check before launch, where each team confirms it is ready.</td></tr></table>

 0:{k:"STEP 1 · MISSION",h:`<h1>Choose a mission</h1>

   <div class="caution">Don't spend everything on the rocket. Keep some budget in reserve for waiting out bad weather or a scrub.</div>

const TUT={open:false,i:0};
function tutShow(i){TUT.i=Math.max(0,Math.min(TUT_PAGES.length-1,i));$("tutBody").innerHTML=TUT_PAGES[TUT.i];$("tutBody").scrollTop=0;

function tutKey(ev){const k=ev.key.toLowerCase();
  if(["arrowright","d","enter"," "].includes(k)){ev.preventDefault();TUT.i===TUT_PAGES.length-1?tutClose():tutShow(TUT.i+1);}
  else if(["arrowleft","a"].includes(k)){ev.preventDefault();tutShow(TUT.i-1);}
  else if(k==="escape"){ev.preventDefault();tutClose();}}
